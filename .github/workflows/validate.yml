name: Validate Sahn PWA

on:
  push:
    branches:
      - main
      - redesign/nassq-visual-identity
  pull_request:
    branches:
      - main

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HTML, local assets, manifest, SVG, and JavaScript syntax
        run: python3 scripts/validate_static.py
