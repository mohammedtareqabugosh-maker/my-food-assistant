<body><main class="app">
<header><div class="brand"><div class="logo"><img src="./icons/icon.svg" alt="شعار صحن"></div><div><h1>صحن</h1><p>مساعدك الغذائي الشخصي</p></div></div><div class="date" id="datePill"></div></header>
<aside class="desktop-sidebar" aria-label="التنقل الرئيسي">
  <div class="sidebar-brand"><div class="sidebar-logo"><img src="./icons/icon.svg" alt=""></div><div><strong>صحن</strong><small>مساعدك الغذائي</small></div></div>

<section id="home" class="section active"><div class="sahn-welcome"><div class="sahn-welcome-copy"><span class="eyebrow">مساحتك الغذائية اليومية</span><h2>عناية أبسط، وتوازن أقرب.</h2><p>كل وجبة خطوة، وكل اختيار يصنع فرقًا. تابع يومك بهدوء، وسجّل أكلك، وخلي صحن يساعدك تفهم عاداتك الغذائية بدون تعقيد.</p><button class="btn" type="button" data-go="add">＋ سجّل وجبة اليوم</button></div><div class="sahn-welcome-art" aria-hidden="true"><svg viewBox="0 0 80 80"><path d="M12 42a28 28 0 0 0 56 0H12Z"/><path d="M18 42a22 22 0 0 1 44 0"/><path d="M40 17c-4-9 3-14 11-15-1 8-4 13-11 15Z"/><path d="M40 17v12"/><path d="M27 33c-4-5-3-10 2-14 4 5 4 10-2 14Z"/><path d="M27 33v8"/></svg></div></div><div class="intro"><small>رحلتك الصحية تبدأ من هنا</small><h2>أهلًا بك 👋</h2><p>سجّل وجباتك وتابع تقدمك نحو أهدافك اليومية.</p></div>
<div class="card"><div class="head"><h3>ملخص اليوم</h3><span class="muted">السعرات الحرارية</span></div><div class="summary"><div class="ring" id="ring"><div><strong id="calEaten">0</strong><span>سعرة مستهلكة</span></div></div><div><div class="muted">هدفك اليومي</div><div class="big" id="calGoalText">2000</div><div class="muted">سعرة حرارية</div><div class="muted" style="margin-top:10px">المتبقي لك</div><div class="big" id="calLeft">2000</div><div class="muted">سعرة حرارية</div></div></div><div class="grid2"><div class="mini"><span>💪 البروتين</span><strong><b id="proteinEaten">0</b> غ</strong><span>من <b id="proteinGoalText">150</b> غ</span></div><div class="mini"><span>🍽️ وجبات اليوم</span><strong id="mealCount">0</strong><span>وجبة مسجلة</span></div></div></div>
<div class="card"><div class="head"><h3>المغذيات اليوم</h3><span class="muted">حسب البيانات المتاحة</span></div><div class="macros"><div class="macro"><span>البروتين</span><strong id="macroP">0 غ</strong></div><div class="macro"><span>الكربوهيدرات</span><strong id="macroC">0 غ</strong></div><div class="macro"><span>الدهون</span><strong id="macroF">0 غ</strong></div></div></div>
<div class="card"><div class="head"><h3>وجبات اليوم</h3><button class="btn" id="quickAdd">+ إضافة وجبة</button></div><div id="todayMeals"></div></div>
<div class="card"><div class="head"><h3>مساعدك الغذائي الذكي ✨</h3></div><p class="muted" style="line-height:1.8">احسب الأطعمة المعروفة محليًا، أو اسأل المساعد لاقتراح وجبة. الصور للمعاينة فقط.</p><button class="btn light" data-go="assistant">افتح المساعد الغذائي ←</button></div></section>
<section id="add" class="section"><div class="intro"><small>سجّل أكلك بدقة</small><h2>إضافة وجبة</h2><p>راجع التفاصيل قبل الحفظ. لن تُسجّل الوجبة إلا بعد التأكيد.</p></div><div class="card"><form id="mealForm"><div class="formgrid">
<div class="field full"><label for="mealName">اسم الوجبة</label><input id="mealName" required placeholder="مثال: دجاج مشوي مع رز"></div>
<div class="field"><label for="mealType">نوع الوجبة</label><select id="mealType"><option>الفطور</option><option>الغداء</option><option>العشاء</option><option>وجبة خفيفة</option><option>مشروب</option></select></div><div class="field"><label for="mealDate">التاريخ والوقت</label><input id="mealDate" type="datetime-local" required></div>
<div class="field full"><label for="ingredients">المكونات والكميات</label><textarea id="ingredients" placeholder="بيضتين، خبز 50 غ، زيت زيتون 5 غ"></textarea></div>
<div class="field"><label for="kcal">السعرات (سعرة)</label><input id="kcal" type="number" min="0" step="1" required></div><div class="field"><label for="protein">البروتين (غ)</label><input id="protein" type="number" min="0" step="0.1" required></div><div class="field"><label for="carbs">الكربوهيدرات (غ)</label><input id="carbs" type="number" min="0" step="0.1"></div><div class="field"><label for="fat">الدهون (غ)</label><input id="fat" type="number" min="0" step="0.1"></div><div class="field full"><label for="notes">ملاحظات (اختياري)</label><input id="notes" placeholder="مثال: الوزن بعد الطبخ"></div></div><div class="notice">القيم الغذائية تقديرية. راجعها قبل التسجيل.</div><div class="actions"><button class="btn" id="saveMeal" type="submit">تأكيد تسجيل الوجبة</button><button class="btn outline" id="cancelEdit" type="button">إلغاء</button></div></form></div></section>
<section id="history" class="section"><div class="intro"><small>بياناتك على جهازك</small><h2>سجل الطعام</h2><p>ابحث عن الوجبات حسب الاسم أو اعرض سجل يوم محدد.</p></div><div class="card"><div class="formgrid"><div class="field"><label for="historyDate">اليوم</label><input id="historyDate" type="date"></div><div class="field"><label for="historySearch">بحث بالاسم أو المكونات</label><input id="historySearch" placeholder="اكتب كلمة للبحث"></div></div><div id="historyResults" style="margin-top:14px"></div></div><div class="card"><div class="head"><h3>نسخة احتياطية</h3></div><p class="muted">صدّر سجلّك إلى ملف JSON أو استعد نسخة سابقة.</p><div class="actions"><button class="btn light" id="exportBtn">تصدير البيانات</button><label class="btn outline" for="importFile">استعادة نسخة</label><input class="hidden" id="importFile" type="file" accept="application/json"></div><div class="notice">الاستيراد يضيف الوجبات إلى السجل ولا يمسح الموجود.</div></div></section>
<section id="assistant" class="section"><div class="intro"><small>مساعدك الغذائي</small><h2>اسأل مساعدك الذكي ✨</h2><p>اكتب مكونات الوجبة والكميات. سيستخدم الحساب المحلي للأطعمة المعروفة، والذكاء الاصطناعي للاقتراحات الأخرى.</p></div><div class="card"><div class="field"><label for="foodDescription">شو ناوي تأكل أو شو أكلت؟</label><textarea id="foodDescription" placeholder="مثال: بيضتين، خبز 50 غ، زيت زيتون 5 غ"></textarea></div><div class="field" style="margin-top:12px"><label for="foodPhoto">صورة الوجبة (اختياري، للتحليل)</label><input id="foodPhoto" type="file" accept="image/*" capture="environment"></div><img id="photoPreview" class="preview hidden" alt="معاينة صورة الوجبة"><div class="actions"><button class="btn" id="prepareAnalysis" type="button">احسب الوجبة / اسأل المساعد</button><button class="btn outline" id="clearAssistant" type="button">مسح</button></div><div class="chat" id="assistantOutput">اكتب مكونات الوجبة أو سؤالك. لن تُحفظ أي وجبة تلقائيًا.</div><div id="assistantActions" class="actions hidden"><button class="btn light" id="useSuggestion" type="button">استخدام الاقتراح وتعبئة نموذج الوجبة</button></div><div class="notice">عند اختيار صورة تُرسل نسخة مصغّرة منها إلى خدمة الذكاء الاصطناعي لتحليلها. لن تُحفظ الوجبة إلا بعد ضغط زر التأكيد.</div></div></section>
<section id="goals" class="section"><div class="intro"><small>إعداداتك الشخصية</small><h2>الأهداف الغذائية</h2><p>غيّر أهدافك اليومية.</p></div><div class="card"><form id="goalsForm"><div class="formgrid"><div class="field"><label for="goalCalories">السعرات اليومية</label><input id="goalCalories" type="number" min="1" required></div><div class="field"><label for="goalProtein">البروتين اليومي (غ)</label><input id="goalProtein" type="number" min="1" required></div></div><div class="actions"><button class="btn" type="submit">حفظ الأهداف</button></div></form></div><div class="card"><div class="head"><h3>التقارير</h3></div><div class="field"><label for="reportPeriod">الفترة</label><select id="reportPeriod"><option value="day">اليوم</option><option value="week">آخر 7 أيام</option><option value="month">آخر 30 يومًا</option></select></div><div id="reportSummary" style="margin-top:14px;line-height:2"></div></div></section>

<section id="weekly" class="section"><div class="intro"><small>مساحة مشتركة</small><h2>الجدول الأسبوعي الموحد</h2><p>كل ما تحفظه هنا يظهر في جدولي الأسبوعي أيضًا.</p></div><div id="weeklySchedule"></div><style>

<div class="shared-schedule" id="shared-schedule">
 <div class="ss-head"><div><div class="ss-eyebrow">YOUR WEEK · جدولك الموحد</div><h2>جدولك الأسبوعي</h2><p class="ss-sub">وجباتك ومهامك في مكان واحد، ومتزامنة بين التطبيقين.</p></div><span aria-hidden="true" style="font-size:1.7rem">✦</span></div>

async function syncMealsToLocal(){
 if(!location.pathname.includes('my-food-assistant'))return;
 let db;
 try{
  if(!user?.id)return;
  db=await new Promise((resolve,reject)=>{const req=indexedDB.open('my-food-assistant-db',1);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
  if(!db.objectStoreNames.contains('meals')||!db.objectStoreNames.contains('settings')){db.close();return}

  const accountSetting=await new Promise((resolve,reject)=>{const req=db.transaction('settings','readonly').objectStore('settings').get('syncUserId');req.onsuccess=()=>resolve(req.result?.value||null);req.onerror=()=>reject(req.error)});

  const byId=new Map(all.filter(m=>m.clientId).map(m=>[String(m.clientId),m]));
  const remoteMeals=rows.filter(r=>r.kind==='meal'),currentIds=new Set(remoteMeals.map(r=>String(r.id)));

  prevReq.onsuccess=()=>{
   const prev=Array.isArray(prevReq.result?.value)?prevReq.result.value:[];
   const removedIds=[];
   for(const id of prev){
    if(!currentIds.has(String(id))){
     const old=byId.get(String(id));
     if(old){store.delete(old.id);if(old.clientId)removedIds.push(String(old.clientId))}
    }
   }
   for(const r of remoteMeals){
    const old=byId.get(String(r.id));
    const remoteTime=Date.parse(r.updated_at||r.created_at||0),localTime=Date.parse(old?.updatedAt||0);
    if(old&&localTime>remoteTime)continue;
    store.put({...(old&&old.id!==undefined?{id:old.id}:{}),clientId:String(r.id),name:r.title||'وجبة',type:r.meal_type||'وجبة خفيفة',date:r.starts_at,ingredients:r.ingredients||r.details||'',notes:r.details||'',calories:Number(r.calories)||0,protein:Number(r.protein)||0,carbs:Number(r.carbs)||0,fat:Number(r.fat)||0,updatedAt:r.updated_at||r.created_at||new Date().toISOString()});
   }
   settings.put({key:'sharedScheduleIds',value:[...currentIds]});
   if(removedIds.length){
    const deletedReq=settings.get('deletedMeals');
    deletedReq.onsuccess=()=>{
     const deleted=Array.isArray(deletedReq.result?.value)?deletedReq.result.value:[];
     settings.put({key:'deletedMeals',value:[...new Set([...deleted,...removedIds])]});
    };
   }
  };
  tx.oncomplete=()=>{db.close();window.dispatchEvent(new Event('shared-schedule-updated'))};
  tx.onerror=()=>{db.close();console.warn('Shared meal local sync transaction failed',tx.error)};
  tx.onabort=()=>db.close();
 }catch(e){if(db)db.close();console.warn('Shared meal local sync failed',e)}
}

async function refresh(){const meals=await allMeals(),list=meals.filter(m=>dayOf(m.date)===today()),sum=k=>list.reduce((a,m)=>a+(Number(m[k])||0),0),c=sum('calories'),p=sum('protein'),carb=sum('carbs'),fat=sum('fat');$('calEaten').textContent=Math.round(c);$('calGoalText').textContent=settings.calories;$('calLeft').textContent=Math.max(0,Math.round(settings.calories-c));$('proteinEaten').textContent=Math.round(p*10)/10;$('proteinGoalText').textContent=settings.protein;$('mealCount').textContent=list.length;$('macroP').textContent=`${Math.round(p*10)/10} غ`;$('macroC').textContent=`${Math.round(carb*10)/10} غ`;$('macroF').textContent=`${Math.round(fat*10)/10} غ`;$('ring').style.background=`conic-gradient(var(--g) ${Math.min(100,c/settings.calories*100)*3.6}deg,var(--ring-track) 0deg)`;$('todayMeals').innerHTML=list.length?list.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(mealHTML).join(''):'<div class="empty">ما سجلت أي وجبة اليوم بعد.<br>اضغط «إضافة وجبة» لتبدأ.</div>';bindButtons($('todayMeals'));renderHistory();renderReport();renderWeekly()}

async function renderReport(){if(!db)return;const meals=await allMeals(),period=$('reportPeriod').value,now=new Date(),start=new Date(now);if(period==='week')start.setDate(start.getDate()-6);if(period==='month')start.setDate(start.getDate()-29);start.setHours(0,0,0,0);const list=meals.filter(m=>new Date(m.date)>=start&&new Date(m.date)<=now),sum=k=>list.reduce((a,m)=>a+(Number(m[k])||0),0),days=new Set(list.map(m=>dayOf(m.date))).size;$('reportSummary').innerHTML=`<div>عدد الوجبات: <b>${list.length}</b></div><div>مجموع السعرات: <b>${Math.round(sum('calories'))}</b></div><div>مجموع البروتين: <b>${Math.round(sum('protein')*10)/10} غ</b></div><div>متوسط السعرات لكل يوم مسجّل: <b>${days?Math.round(sum('calories')/days):0}</b></div><div class="muted">الفترة تشمل ${days} أيام فيها وجبات.</div>`}

function shrinkImage(dataUrl,max=900){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.8))};img.onerror=reject;img.src=dataUrl})}
$('foodPhoto').onchange=e=>{const f=e.target.files[0];if(!f){$('photoPreview').classList.add('hidden');photoData='';return}const r=new FileReader();r.onload=async()=>{try{photoData=await shrinkImage(r.result)}catch{photoData=r.result}$('photoPreview').src=photoData;$('photoPreview').classList.remove('hidden')};r.readAsDataURL(f)};
const FOODS=[
{names:['بيض مسلوق','بيض','البيض','بيضة'],k:155,p:12.6,c:1.1,f:10.6},

{names:['زبادي','لبن رائب','لبن'],k:61,p:3.5,c:4.7,f:3.3},{names:['بطاطا مسلوقة','بطاطا مشوية','بطاطا'],k:87,p:1.9,c:20.1,f:.1},

{names:['حليب قليل الدسم','حليب كامل الدسم','حليب'],k:61,p:3.2,c:4.8,f:3.3},{names:['جبنة قليلة الدسم','جبنة بيضاء','جبنة'],k:264,p:14,c:4,f:21},

function norm(s){return String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\s+/g,' ').trim()}
const r1=n=>Math.round((Number(n)||0)*10)/10;
function matchFood(piece){const t=norm(piece);let best=null;for(const food of FOODS)for(const alias of food.names){const a=norm(alias);if(a&&t.includes(a)&&(!best||a.length>best.a.length))best={food,a};}return best}
function parseGrams(piece,food){const t=norm(piece);let m=t.match(/(\d+(?:[.,]\d+)?)\s*(?:غرام|جرام|غ|جم|g|grams?)(?![a-z])/i);if(m)return Number(m[1].replace(',','.'));m=t.match(/(\d+(?:[.,]\d+)?)\s*(?:مل|ml)(?![a-z])/i);if(m)return Number(m[1].replace(',','.'));if(food.names.some(n=>norm(n)==='بيض'||norm(n)==='بيض مسلوق')&&/بيضتين|بيضتان/.test(t))return 100;if(/بيضتين|بيضتان/.test(t)&&food.names.some(n=>norm(n).includes('بيض')))return 100;return null}
function localCalc(text){const pieces=String(text).split(/[,،؛+\n]/).map(x=>x.trim()).filter(Boolean);if(!pieces.length)return null;const items=[],unknown=[];for(const piece of pieces){const hit=matchFood(piece);if(!hit){unknown.push(piece);continue}const grams=parseGrams(piece,hit.food);if(!grams||grams<=0){unknown.push(piece);continue}const q=grams/100;items.push({name:piece,grams,kcal:Math.round(hit.food.k*q),protein:r1(hit.food.p*q),carbs:r1(hit.food.c*q),fat:r1(hit.food.f*q)})}if(!items.length)return null;const totals=items.reduce((s,x)=>({kcal:s.kcal+x.kcal,protein:s.protein+x.protein,carbs:s.carbs+x.carbs,fat:s.fat+x.fat}),{kcal:0,protein:0,carbs:0,fat:0});return {items,unknown,totals:{calories:Math.round(totals.kcal),protein:r1(totals.protein),carbs:r1(totals.carbs),fat:r1(totals.fat)}}}
function setMessage(s){$('assistantOutput').textContent=s}

const meals=(await allMeals()).filter(m=>dayOf(m.date)===today()).map(m=>({name:m.name,calories:Number(m.calories)||0,protein:Number(m.protein)||0,carbs:Number(m.carbs)||0,fat:Number(m.fat)||0}));
const res=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:photoData||undefined,mealName:desc.slice(0,160),message:desc,eatenToday:meals,targetMin:Math.max(1200,settings.calories-100),targetMax:settings.calories,targetProtein:settings.protein})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.ok)throw Error(data.error||`خطأ اتصال (${res.status})`);const a=data.answer||{};suggestion={description:desc,name:String(a.portion||desc),calories:Math.max(0,Number(a.calories)||0),protein:Math.max(0,Number(a.protein)||0),carbs:Math.max(0,Number(a.carbs)||0),fat:Math.max(0,Number(a.fat)||0),unverified:true};setMessage(`${String(a.reply||'اقتراح تقديري من المساعد.')}\n\nالكمية: ${suggestion.name}\nالسعرات: ${suggestion.calories}\nالبروتين: ${suggestion.protein} غ\nالكربوهيدرات: ${suggestion.carbs} غ\nالدهون: ${suggestion.fat} غ\n\nتنبيه: هذه قيم مولّدة آليًا ولم تُحسب من القاعدة المحلية. راجعها قبل التسجيل.\nلم يتم حفظ أي شيء.`);$('assistantActions').classList.remove('hidden')
}catch(err){setMessage(`تعذر إعداد الاقتراح.\nالسبب: ${String(err?.message||err).slice(0,300)}\nلم يتم حفظ أي وجبة.`)}finally{b.disabled=false;b.textContent='احسب الوجبة / اسأل المساعد'}};

window.__weeklyReturn=false;
async function renderWeekly(){
 const root=$('weeklySchedule');if(!root||!db)return;
 const meals=await allMeals();
 const now=new Date(),start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);
 const names=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
 let html='';
 for(let i=0;i<7;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);
  const key=dayOf(d),items=meals.filter(m=>dayOf(m.date)===key).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const kcal=items.reduce((a,m)=>a+(Number(m.calories)||0),0),protein=items.reduce((a,m)=>a+(Number(m.protein)||0),0);
  html+='<div class="card weekly-day"><div class="weekly-day-head"><div><div class="weekly-day-title">'+names[i]+'</div><div class="weekly-day-sub">'+escapeHTML(new Intl.DateTimeFormat('ar-JO',{day:'numeric',month:'long'}).format(d))+'</div></div><button type="button" class="weekly-add" data-week-add="'+key+'">＋ إضافة وجبة</button></div>';
  html+=items.length?items.map(mealHTML).join(''):'<div class="weekly-empty">لا توجد وجبات مسجلة لهذا اليوم.</div>';
  html+='<div class="weekly-total"><span>🍽️ '+items.length+' وجبات</span><span>🔥 '+Math.round(kcal)+' سعرة</span><span>💪 '+Math.round(protein*10)/10+' غ بروتين</span></div></div>';
 }
 root.innerHTML=html;bindButtons(root);
}
